name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.6.7
  # sha256 of kubeconform-linux-amd64.tar.gz at that version — the only
  # downloaded executable in the pipeline, so its content is pinned too.
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify structure and vet
        run: make verify-structure vet
      - name: Unit tests (race + coverage)
        run: make test-race
      - name: govulncheck (known CVEs in the dependency graph, symbol-level)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  verify-codegen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Regenerate and tidy
        run: make fmt vet tidy generate
      - name: Fail if the tree is dirty
        run: make verify-dirty

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz smoke test
        run: make fuzz-smoketest

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor (1.30 — CEL matchConditions GA, kubeVersion
        # ">=1.30.0-0" in the chart) and the latest minor: without the floor
        # entry, the oldest supported apiserver is never actually exercised.
        envtest-k8s-version: ["1.30.3", "1.36.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests (envtest ${{ matrix.envtest-k8s-version }})
        run: make test-integration ENVTEST_K8S_VERSION=${{ matrix.envtest-k8s-version }}

  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform (checksum-verified)
        run: |
          curl -sSLf -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Validate Kustomize overlays
        run: |
          for dir in deploy/base deploy/overlays/dev deploy/overlays/prod; do
            echo "== $dir =="
            kustomize build "$dir" | kubeconform -strict -ignore-missing-schemas -summary
          done

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform (checksum-verified)
        run: |
          curl -sSLf -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Lint and render chart
        run: |
          helm lint charts/flux-drift-webhook
          helm template flux-drift-webhook charts/flux-drift-webhook -n flux-system \
            | kubeconform -strict -ignore-missing-schemas -summary

  # The only suite that proves the webhook actually BLOCKS: unit tests run
  # against fakes and the audit-mode suite only ever asserts warnings, so
  # e2e/test-enforce.sh (run by run-e2e.sh after the audit pass) is the sole
  # automated exercise of the end-to-end chain — VWC interception, cert-manager
  # TLS, enforce-overlay flags, real apiserver rejections, the T12 readiness
  # gate. All third-party manifests are vendored under e2e/, so the cluster
  # needs no internet access.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
      - name: Install kustomize if missing
        run: |
          if ! command -v kustomize >/dev/null 2>&1; then
            curl -sSLf "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
              | tar -xz kustomize
            sudo install -m 0755 kustomize /usr/local/bin/kustomize
          fi
          kustomize version
      - name: E2E tests (kind, audit + enforce)
        run: make test-e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
