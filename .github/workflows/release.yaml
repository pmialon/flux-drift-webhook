name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A release must never sign and publish untested code: ci.yaml only triggers
  # on pull requests and pushes to main, so a tag laid on a commit that failed
  # CI — or was never covered by it (e.g. a hotfix branch) — would otherwise be
  # built, cosign-signed and SLSA-attested as-is. The cheap, high-value gate:
  # vet, the race-enabled unit tests and the envtest integration suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify structure and vet
        run: make verify-structure vet
      - name: Unit tests (race)
        run: make test-race
      - name: Integration tests (envtest)
        run: make test-integration

  release:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing (OIDC)
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert the chart and overlays track the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart_version=$(awk '/^version:/ {print $2}' charts/flux-drift-webhook/Chart.yaml)
          if [ "${chart_version}" != "${version}" ]; then
            echo "Chart.yaml version=${chart_version} does not match tag ${GITHUB_REF_NAME}: bump version/appVersion before tagging" >&2
            exit 1
          fi
          for overlay in deploy/overlays/dev deploy/overlays/prod; do
            pinned=$(awk '/newTag:/ {gsub(/"/, "", $2); print $2}' "${overlay}/kustomization.yaml")
            if [ -n "${pinned}" ] && [ "${pinned}" != "${version}" ]; then
              echo "${overlay} pins image tag ${pinned}, expected ${version}" >&2
              exit 1
            fi
          done
      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/flux-drift-webhook
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/flux-drift-webhook@${{ steps.build.outputs.digest }}"
      - name: Render release manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p output
          # The image tag has no "v": docker/metadata-action pushes
          # {{version}}, which strips it. Using GITHUB_REF_NAME here pinned the
          # released manifest to a tag that does not exist.
          image_tag="${GITHUB_REF_NAME#v}"
          ( cd deploy/base && \
            kustomize edit set image "ghcr.io/pmialon/flux-drift-webhook=ghcr.io/${{ github.repository_owner }}/flux-drift-webhook:${image_tag}" )
          kustomize build deploy/base > output/flux-drift-webhook.deployment.yaml
          # `kustomize edit` rewrites the file in place. GoReleaser aborts on a dirty
          # worktree, so restore it once the manifest is rendered.
          git checkout -- deploy/base/kustomization.yaml
          git status --porcelain
      - name: Install Syft
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Run GoReleaser
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and sign Helm chart (OCI)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package --version "${version}" --app-version "${version}" charts/flux-drift-webhook
          helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          push_output=$(helm push "flux-drift-webhook-${version}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1)
          echo "${push_output}"
          digest=$(echo "${push_output}" | awk '/Digest:/ {print $2}')
          test -n "${digest}" || { echo "could not extract the chart digest from helm push output" >&2; exit 1; }
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/flux-drift-webhook@${digest}"

  provenance:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/flux-drift-webhook
      digest: ${{ needs.release.outputs.image-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
