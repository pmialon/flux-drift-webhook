{{- if and (not .Values.certManager.enabled) (not .Values.tls.caBundle) -}}
{{- fail "certManager.enabled=false requires tls.caBundle (and tls.secretName) to be set" -}}
{{- end -}}
{{- /* The exclusion list must stay BYTE-IDENTICAL to what the controller
applies (excludedNamespaces() dedups extras against the built-ins and
themselves; the selector is atomic under SSA, so any difference makes the two
appliers churn forever). Same algorithm here. */ -}}
{{- $excludedNS := list "kube-system" "kube-public" "kube-node-lease" .Release.Namespace -}}
{{- range .Values.webhook.extraExcludedNamespaces -}}
{{- if not (has . $excludedNS) -}}{{- $excludedNS = append $excludedNS . -}}{{- end -}}
{{- end -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  # The controller reconciles the VWC by this exact name (its --webhook-name).
  name: {{ include "flux-drift-webhook.webhookName" . }}
  labels:
    {{- include "flux-drift-webhook.labels" . | nindent 4 }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "flux-drift-webhook.certName" . }}
  {{- end }}
# Two entries express the OR a single objectSelector cannot: the API server
# only forwards requests for objects carrying a Flux ownership label
# (Kustomization or HelmRelease). The selector matches the old OR the new
# object on UPDATE/DELETE, so label stripping cannot dodge interception.
#
# The rules and matchConditions below MUST stay byte-identical to what the
# controller applies (internal/controller/webhook_config.go): both this
# manifest's applier and the controller server-side-apply the same values, so
# they co-own the fields without churn. `rules` is an atomic list — shipping it
# empty here would let a GitOps applier (kustomize-controller applies with
# Force, helm-controller with drift detection) wipe the controller-applied
# rules on every reconciliation, disarming the webhook until the next
# --vwc-resync-interval tick.
webhooks:
  - name: kustomize.{{ include "flux-drift-webhook.webhookName" . }}
    clientConfig:
      service:
        name: {{ include "flux-drift-webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: {{ .Values.service.port }}
      {{- if not .Values.certManager.enabled }}
      caBundle: {{ .Values.tls.caBundle }}
      {{- end }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [{{ range $i, $ns := $excludedNS }}{{ if $i }}, {{ end }}{{ $ns | quote }}{{ end }}]
    objectSelector:
      matchExpressions:
        - key: kustomize.toolkit.fluxcd.io/name
          operator: Exists
    rules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*"]
        scope: "*"
        operations: ["CREATE", "UPDATE", "DELETE"]
    matchConditions:
      - name: exclude-admissionregistration.k8s.io
        expression: 'request.resource.group != "admissionregistration.k8s.io"'
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    sideEffects: None
    admissionReviewVersions: ["v1"]
    matchPolicy: Equivalent
  - name: helm.{{ include "flux-drift-webhook.webhookName" . }}
    clientConfig:
      service:
        name: {{ include "flux-drift-webhook.serviceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: {{ .Values.service.port }}
      {{- if not .Values.certManager.enabled }}
      caBundle: {{ .Values.tls.caBundle }}
      {{- end }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [{{ range $i, $ns := $excludedNS }}{{ if $i }}, {{ end }}{{ $ns | quote }}{{ end }}]
    objectSelector:
      matchExpressions:
        - key: helm.toolkit.fluxcd.io/name
          operator: Exists
    rules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*"]
        scope: "*"
        operations: ["CREATE", "UPDATE", "DELETE"]
    matchConditions:
      - name: exclude-admissionregistration.k8s.io
        expression: 'request.resource.group != "admissionregistration.k8s.io"'
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    sideEffects: None
    admissionReviewVersions: ["v1"]
    matchPolicy: Equivalent
